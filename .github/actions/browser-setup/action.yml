name: Browser harness setup
description: Pinned runtime setup inside the matching Playwright container.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: "22"
    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Install Python dependencies
      shell: bash
      run: python -m pip install --require-hashes -r requirements-dev.txt
    - name: Install Playwright
      shell: bash
      run: npm ci
