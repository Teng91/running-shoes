# SPEC-078: a daily encrypted copy of the production database outside Fly.
#
# The repository is public, so its artifacts and logs are visible to any signed-in
# GitHub user. Only an AES-256 archive encrypted with the BACKUP_PASSPHRASE secret is
# uploaded; the job refuses to run without it, and logs never print account data.
name: offsite-backup

on:
  schedule:
    - cron: "30 19 * * *" # 03:30 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offsite-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_APP: running-shoes
    steps:
      - name: Require the encryption passphrase and the Fly token
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ "${#BACKUP_PASSPHRASE}" -lt 20 ]; then
            echo "::error::BACKUP_PASSPHRASE is missing or shorter than 20 characters; refusing to create a backup that could be uploaded unencrypted"
            exit 1
          fi
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN is not set"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Wake the production machine
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS -m 10 -o /dev/null "https://$FLY_APP.fly.dev/health/ready"; then exit 0; fi
            sleep 5
          done
          echo "::warning::/health/ready did not answer; the snapshot step will still try SSH"
      - name: Pull a verified snapshot and run an isolated restore drill
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # RUNNER_TEMP is outside the checkout, as offsite_backup.py requires. Its output
        # names only the snapshot file, never account data.
        run: python scripts/offsite_backup.py --app "$FLY_APP" --output-dir "$RUNNER_TEMP/offsite"
      - name: Encrypt the snapshot and delete the plain copy
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          snapshot_dir=$(find "$RUNNER_TEMP/offsite" -mindepth 1 -maxdepth 1 -type d -name "$FLY_APP-*" | head -n 1)
          test -n "$snapshot_dir"
          archive="$RUNNER_TEMP/upload/$FLY_APP-$(date -u +%Y%m%dT%H%M%SZ).tar.gz.enc"
          mkdir -p "$RUNNER_TEMP/upload"
          tar -C "$snapshot_dir" -czf - . \
            | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -pass env:BACKUP_PASSPHRASE -out "$archive"
          rm -rf "$RUNNER_TEMP/offsite"
          # Prove the archive decrypts to the database, checksum and manifest before uploading it.
          # Read the whole listing first: `grep -q` would exit early and break tar's pipe under pipefail.
          listing=$(openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:BACKUP_PASSPHRASE -in "$archive" | tar -tzf -)
          for part in '\.db$' '\.db\.sha256$' 'manifest\.json$'; do
            grep -Eq "$part" <<< "$listing" || { echo "::error::encrypted archive is missing $part"; exit 1; }
          done
          echo "Encrypted archive ready: $(basename "$archive") ($(stat -c %s "$archive") bytes)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encrypted-database-${{ github.run_id }}
          path: ${{ runner.temp }}/upload/*.tar.gz.enc
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # SPEC-116: GitHub silently disables every scheduled workflow of a public repository
  # after 60 days without a commit, and scheduled runs do not count as activity. This
  # job re-enables both scheduled workflows each day without creating a commit. It is
  # separate so that only it holds actions: write (the backup job keeps contents: read)
  # and a failed re-enable only warns, never failing or blocking the backup.
  keep-schedules-enabled:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable the scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in offsite-backup.yml verify.yml; do
            if gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/enable" > /dev/null; then
              echo "Re-enabled the schedule of $workflow"
            else
              echo "::warning::Could not re-enable the schedule of $workflow"
            fi
          done
