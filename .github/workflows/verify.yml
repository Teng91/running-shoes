name: Verify and deploy

# Every push to any branch, every pull request and a weekly schedule run the full
# harness, including documentation-only changes (docs-check guards README, specs and
# links). The repository is public, so standard runners cost no minutes (SPEC-061).
# - push: each pushed commit gets a result before any pull request exists.
# - pull_request: tests the merge of the branch into the current main, and fork PRs.
# - schedule: the weekly run's dependency audit catches newly published CVEs.
# Only a push to main (or a manual run on main) continues: database snapshot →
# fly deploy → anonymous release check → tag and GitHub Release when package.json
# carries a new version. A commit message containing [skip ci] skips the workflow.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Production runs go one at a time, so a deploy, its release check and its tag never
# interleave with the next push; a running deploy is never cancelled (GitHub keeps
# only the newest waiting run). On any other ref a newer push cancels the older run.
concurrency:
  group: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'production' || format('ci-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ !(github.event_name != 'pull_request' && github.ref == 'refs/heads/main') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Run repository harness
        run: python scripts/task.py verify

  frontend-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/browser-setup
      # Browser jobs retry once: CI WebKit occasionally reports an internal error. A real
      # regression fails both attempts; a passing retry still leaves a visible warning.
      - name: Run layout matrix
        run: python scripts/task.py frontend-layout || { echo "::warning::frontend-layout failed once; retrying"; python scripts/task.py frontend-layout; }
      - name: Save browser failure diagnostics
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@v7
        with:
          name: frontend-layout-failure-diagnostics
          path: .artifacts/browser/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  frontend-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/browser-setup
      - name: Run browser CRUD flow
        run: python scripts/task.py frontend-e2e || { echo "::warning::frontend-e2e failed once; retrying"; python scripts/task.py frontend-e2e; }
      - name: Save browser failure diagnostics
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-failure-diagnostics
          path: .artifacts/browser/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  frontend-pwa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/browser-setup
      - name: Run PWA upgrade and offline flow
        run: python scripts/task.py frontend-pwa || { echo "::warning::frontend-pwa failed once; retrying"; python scripts/task.py frontend-pwa; }
      - name: Exercise synthetic failure capture
        run: python scripts/task.py diagnostics-generate
      - name: Upload synthetic diagnostics for roundtrip verification
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics-roundtrip
          path: .artifacts/browser/roundtrip/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Save browser failure diagnostics
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@v7
        with:
          name: frontend-pwa-failure-diagnostics
          path: .artifacts/browser/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  diagnostics-roundtrip:
    needs: frontend-pwa
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Download synthetic diagnostics
        uses: actions/download-artifact@v8
        with:
          name: browser-diagnostics-roundtrip
          path: .artifacts/browser/roundtrip/
      - name: Verify downloaded trace, screenshot and error contents
        run: python scripts/task.py diagnostics-verify

  # The only job that receives FLY_API_TOKEN. It installs and runs no project
  # packages: it only drives flyctl against the app named in fly.toml.
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [verify, frontend-layout, frontend-e2e, frontend-pwa, diagnostics-roundtrip]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_APP: running-shoes
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - name: Require the deploy token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Repository secret FLY_API_TOKEN is not set (README: 自動部署與發版)"
            exit 1
          fi
      - name: Wake the production machine
        # auto_stop_machines may have stopped it; any request starts it again.
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS -m 10 -o /dev/null "https://$FLY_APP.fly.dev/health/ready"; then exit 0; fi
            sleep 5
          done
          echo "::warning::/health/ready did not answer; the snapshot step will still try SSH"
      - name: Snapshot the production database on its volume
        # A verified on-volume copy before every deploy; a failed snapshot stops the deploy.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ssh console -a "$FLY_APP" -C "python scripts/database_backup.py create --source /data/shoes.db --output-dir /data/backups/predeploy --keep 10" | tee snapshot.log
          grep -q "Backup created and verified: " snapshot.log
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # One machine: SQLite lives on a single volume.
        run: flyctl deploy --remote-only --ha=false

  # Anonymous, read-only checks of the live site against this commit; no secrets.
  release-check:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/browser-setup
      - name: Check the deployed release
        run: python scripts/task.py release-check --base-url https://running-shoes.fly.dev || { echo "::warning::release-check failed once; retrying"; python scripts/task.py release-check --base-url https://running-shoes.fly.dev; }

  # The only job that can write to the repository: it tags a new version once the
  # live site passed its release check. A push without a version bump only deploys.
  release:
    needs: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag and publish a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          ASSETS=$(python3 -c "import json; print(json.load(open('frontend/assets.json'))['version'])")
          if [ "$VERSION" != "$ASSETS" ]; then
            echo "::error::package.json $VERSION and frontend/assets.json $ASSETS disagree"
            exit 1
          fi
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG was already released; this push only deployed."
            exit 0
          fi
          python3 - "$VERSION" > release-notes.md <<'PY'
          import re
          import subprocess
          import sys

          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read().replace("\r\n", "\n")
          section = re.search(r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          if section and section.group(1).strip():
              print("\n" + section.group(1).strip() + "\n")
          else:
              print(f"::warning::CHANGELOG.md has no section for {version}; listing commits", file=sys.stderr)
              log = subprocess.run(["git", "log", "--no-merges", "--pretty=- %s", "-20"],
                                   capture_output=True, text=True, check=True).stdout
              print("## Changes\n\n" + log)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
