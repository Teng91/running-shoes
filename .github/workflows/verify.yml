name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Run repository harness
        shell: pwsh
        run: ./scripts/task.ps1 verify

  frontend-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright
      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Run layout matrix
        run: node unit_tests/frontend_layout.cjs
