name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Run repository harness
        run: python scripts/task.py verify

  frontend-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright
      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Run layout matrix
        run: python scripts/task.py frontend-layout
      - name: Run browser CRUD flow
        run: python scripts/task.py frontend-e2e
