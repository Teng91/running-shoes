name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Run repository harness
        run: python scripts/task.py verify

  frontend-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/browser-setup
      - name: Run layout matrix
        run: python scripts/task.py frontend-layout
      - name: Save browser failure diagnostics
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@v7
        with:
          name: frontend-layout-failure-diagnostics
          path: .artifacts/browser/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/browser-setup
      - name: Run browser CRUD flow
        run: python scripts/task.py frontend-e2e
      - name: Save browser failure diagnostics
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-failure-diagnostics
          path: .artifacts/browser/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  frontend-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/browser-setup
      - name: Run PWA upgrade and offline flow
        run: python scripts/task.py frontend-pwa
      - name: Exercise synthetic failure capture
        run: python scripts/task.py diagnostics-generate
      - name: Upload synthetic diagnostics for roundtrip verification
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics-roundtrip
          path: .artifacts/browser/roundtrip/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Save browser failure diagnostics
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@v7
        with:
          name: frontend-pwa-failure-diagnostics
          path: .artifacts/browser/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  diagnostics-roundtrip:
    needs: frontend-pwa
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Download synthetic diagnostics
        uses: actions/download-artifact@v8
        with:
          name: browser-diagnostics-roundtrip
          path: .artifacts/browser/roundtrip/
      - name: Verify downloaded trace, screenshot and error contents
        run: python scripts/task.py diagnostics-verify
