<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跑鞋追蹤 Dashboard</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4" onerror="console.error('Chart.js CDN failed')"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js" onerror="console.error('marked.js CDN failed')"></script>
<style>
:root {
  --bg: #0f1117;
  --card: #1a1d2e;
  --border: #2a2d3e;
  --text: #e4e4e7;
  --text-dim: #8b8d9a;
  --accent: #6366f1;
  --accent-light: #818cf8;
  --green: #22c55e;
  --yellow: #eab308;
  --orange: #f97316;
  --red: #ef4444;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; opacity: 0; transition: opacity 0.15s; }
.container { max-width: 1400px; margin: 0 auto; padding: 24px; }
h1 { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
.subtitle { color: var(--text-dim); font-size: 14px; margin-bottom: 24px; }

/* Tabs */
.tabs { display: flex; gap: 8px; margin-bottom: 24px; }
.tab {
  padding: 8px 20px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 500;
  transition: background 0.15s, color 0.15s;
}
.tab:hover { color: var(--text); }
.tab.active { background: var(--accent); color: white; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.tab-panel.agent-panel.active { display: flex; }

/* Auth View */
.auth-box { max-width: 360px; margin: 80px auto; }
.auth-box h1 { text-align: center; margin-bottom: 24px; }
.auth-error { color: var(--red); font-size: 13px; margin: 8px 0; display: none; }

/* Summary Cards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.card-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.card-value { font-size: 28px; font-weight: 700; }
.card-sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

/* Charts */
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }
.chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.chart-box h3 { font-size: 14px; color: var(--text-dim); margin-bottom: 12px; font-weight: 500; }
.chart-box canvas { max-height: 240px; }
.chart-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.chart-title-row h3 { margin-bottom: 0; }
.year-select { background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 12px; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
.year-select:focus { outline: none; border-color: var(--accent); }

/* Inline add row */
.inline-add { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.inline-add select, .inline-add input { background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 13px; padding: 6px 8px; border-radius: 6px; }
.inline-add input { width: 100px; }
.inline-add select:focus, .inline-add input:focus { outline: none; border-color: var(--accent); }
.inline-error { color: var(--red); font-size: 12px; width: 100%; }

/* Table */
.table-section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 28px; }
.table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.table-header h2 { font-size: 16px; font-weight: 600; }
.btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-light); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-edit { background: #334155; color: var(--text); }
.btn-edit:hover { background: #475569; }
.btn-delete { background: #7f1d1d; color: #fca5a5; }
.btn-delete:hover { background: #991b1b; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 10px 8px; color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 10px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tr:hover td { background: rgba(99,102,241,0.05); }
.brand { font-weight: 600; color: var(--accent-light); }

/* Editable cell */
.editable { cursor: pointer; border-radius: 4px; padding: 2px 4px; transition: background 0.2s; }
.editable:hover { background: rgba(99,102,241,0.15); }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: 480px; max-height: 90vh; overflow-y: auto; }
.modal h2 { font-size: 18px; margin-bottom: 20px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
.form-group input, .form-group select { width: 100%; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; }
.form-group input:focus { outline: none; border-color: var(--accent); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
.btn-cancel { background: #334155; color: var(--text); }

/* Inline edit */
.inline-input { width: 70px; padding: 2px 6px; background: var(--bg); border: 1px solid var(--accent); border-radius: 4px; color: var(--text); font-size: 13px; text-align: right; }

/* Color dots for brands */
.brand-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

/* Header with logout */
.app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.app-header h1 { margin-bottom: 0; }
.user-info { display: flex; align-items: center; gap: 12px; }
.user-name { color: var(--text-dim); font-size: 14px; }

@media (max-width: 900px) {
  .charts { grid-template-columns: 1fr; }
}
.charts-3col { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 1100px) {
  .charts-3col { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 700px) {
  .charts-3col { grid-template-columns: 1fr; }
}

/* Agent Chat styles */
.agent-panel { flex-direction: column; flex: 1; min-height: 0; }
.agent-config { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; flex-shrink: 0; }
.agent-config select { background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 13px; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
.agent-config select:focus { outline: none; border-color: var(--accent); }
.agent-config button { background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 16px; padding: 4px 10px; border-radius: 8px; cursor: pointer; transition: opacity 0.2s; }
.agent-config button:hover { opacity: 0.7; }
.agent-config button:disabled { opacity: 0.4; cursor: not-allowed; }
.agent-config input[type="text"] { background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 13px; padding: 6px 10px; border-radius: 8px; }
.agent-config input[type="text"]:focus { outline: none; border-color: var(--accent); }
.agent-messages { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; flex: 1; min-height: 0; overflow-y: auto; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
.agent-message { display: flex; flex-shrink: 0; }
.agent-message.user { justify-content: flex-end; }
.agent-message.bot { justify-content: flex-start; }
.agent-msg-content { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.7; word-wrap: break-word; overflow-wrap: break-word; }
.agent-msg-content p { margin: 6px 0; }
.agent-msg-content h1, .agent-msg-content h2, .agent-msg-content h3,
.agent-msg-content h4 { margin: 12px 0 6px; font-weight: 600; line-height: 1.3; }
.agent-msg-content h1 { font-size: 18px; }
.agent-msg-content h2 { font-size: 16px; }
.agent-msg-content h3, .agent-msg-content h4 { font-size: 15px; }
.agent-msg-content ul, .agent-msg-content ol { padding-left: 20px; margin: 4px 0; }
.agent-msg-content li { margin: 2px 0; }
.agent-msg-content table { border-collapse: collapse; margin: 8px 0; font-size: 13px; width: 100%; display: block; overflow-x: auto; }
.agent-msg-content th, .agent-msg-content td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; white-space: nowrap; }
.agent-msg-content th { background: rgba(99,102,241,0.1); font-weight: 600; }
.agent-msg-content hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
.agent-msg-content strong { font-weight: 600; }
.agent-msg-content em { font-style: italic; }
.agent-msg-content a { color: var(--accent-light); text-decoration: underline; }
.agent-msg-content code { background: rgba(99,102,241,0.15); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
.agent-msg-content pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-x: auto; margin: 8px 0; }
.agent-msg-content pre code { background: none; padding: 0; }
.agent-msg-content blockquote { border-left: 3px solid var(--accent); padding-left: 12px; margin: 8px 0; color: var(--text-dim); }
.agent-message.user .agent-msg-content { max-width: 80%; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
.agent-message.bot .agent-msg-content { background: var(--bg); color: var(--text); border-bottom-left-radius: 4px; }
.agent-input-area { display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0; }
.agent-input-area textarea { flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--text); font-size: 14px; padding: 10px 14px; border-radius: 12px; resize: none; font-family: inherit; }
.agent-input-area textarea:focus { outline: none; border-color: var(--accent); }
.agent-input-area button { padding: 10px 24px; background: var(--accent); color: white; border: none; border-radius: 12px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
.agent-input-area button:hover { background: var(--accent-light); }
.agent-input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
.agent-typing .agent-msg-content::after { content: '▍'; animation: blink 1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* Agent reasoning / thinking bubble */
.agent-thinking {
  font-size: 13px;
  color: var(--text-dim);
  font-style: italic;
  padding: 8px 14px;
  margin: 2px 0 2px 16px;
  background: rgba(99,102,241,0.06);
  border-left: 2px solid var(--accent);
  border-radius: 6px;
  line-height: 1.5;
  word-wrap: break-word;
  flex-shrink: 0;
}

/* Tool status container — groups all tool calls in one round */
.agent-tools {
  margin: 0 0 0 16px;
  font-size: 12px;
  flex-shrink: 0;
}
.agent-tools .tool-item {
  padding: 3px 0;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 6px;
}
.agent-tools .tool-item .tool-icon { display: inline-block; width: 14px; text-align: center; }
.agent-tools .tool-item.done { color: var(--green); }
.agent-tools .tool-item.done .tool-name { text-decoration: line-through; opacity: 0.7; }

/* Retry button — small inline icon like ChatGPT */
.agent-retry-btn {
  font-size: 12px;
  color: var(--text-dim);
  cursor: pointer;
  padding: 2px 8px;
  margin: 2px 0 2px 16px;
  border: 1px solid var(--border);
  border-radius: 6px;
  display: inline-block;
  align-self: flex-start;
  background: transparent;
  transition: all 0.15s;
  flex-shrink: 0;
  line-height: 1.6;
}
.agent-retry-btn:hover { color: var(--text); border-color: var(--accent); background: rgba(99,102,241,0.08); }
</style>
</head>
<body>

<!-- Auth View -->
<div class="container" id="auth-view" style="display:none;">

  <!-- Login Form -->
  <div class="auth-box" id="login-form">
    <h1>跑鞋追蹤</h1>
    <div class="form-group">
      <label>帳號</label>
      <input id="login-username" placeholder="Username">
    </div>
    <div class="form-group">
      <label>密碼</label>
      <input id="login-password" type="password" placeholder="Password">
    </div>
    <div class="auth-error" id="auth-error"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="handleLogin()">登入</button>
    <div style="text-align:center;margin-top:12px;">
      <a href="#" onclick="showChangeForm();return false;" style="color:var(--text-dim);font-size:13px;">更改密碼</a>
      <span style="color:var(--border);margin:0 8px;">|</span>
      <a href="#" onclick="showRegisterForm();return false;" style="color:var(--accent-light);font-size:13px;">註冊</a>
    </div>
  </div>

  <!-- Register Form -->
  <div class="auth-box" id="register-form" style="display:none;">
    <h1>註冊帳號</h1>
    <div class="form-group">
      <label>帳號</label>
      <input id="reg-username" placeholder="Username">
    </div>
    <div class="form-group">
      <label>密碼</label>
      <input id="reg-password" type="password" placeholder="Password">
    </div>
    <div class="form-group">
      <label>確認密碼</label>
      <input id="reg-password2" type="password" placeholder="Confirm Password">
    </div>
    <div class="auth-error" id="reg-error"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="handleRegister()">註冊</button>
    <div style="text-align:center;margin-top:12px;">
      <a href="#" onclick="showLoginForm();return false;" style="color:var(--accent-light);font-size:13px;">已有帳號？登入</a>
    </div>
  </div>

  <!-- Change Password Form -->
  <div class="auth-box" id="change-form" style="display:none;">
    <h1>更改密碼</h1>
    <div class="form-group">
      <label>帳號</label>
      <input id="change-username" placeholder="Username">
    </div>
    <div class="form-group">
      <label>舊密碼</label>
      <input id="change-old-password" type="password" placeholder="Old Password">
    </div>
    <div class="form-group">
      <label>新密碼</label>
      <input id="change-new-password" type="password" placeholder="New Password">
    </div>
    <div class="form-group">
      <label>確認新密碼</label>
      <input id="change-new-password2" type="password" placeholder="Confirm New Password">
    </div>
    <div class="auth-error" id="change-error"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="handleChangePassword()">更改密碼</button>
    <div style="text-align:center;margin-top:12px;">
      <a href="#" onclick="showLoginForm();return false;" style="color:var(--accent-light);font-size:13px;">回登入頁</a>
    </div>
  </div>

</div>

<!-- App View -->
<div class="container" id="app-view" style="display:none;">
  <div class="app-header">
    <h1>跑鞋追蹤 Dashboard</h1>
    <div class="user-info">
      <span class="user-name" id="user-label"></span>
      <button class="btn btn-sm btn-edit" onclick="handleLogout()">登出</button>
    </div>
  </div>
  <p class="subtitle" id="today-label"></p>

  <div class="tabs">
    <button class="tab active" data-tab="shoes" onclick="switchTab('shoes')">跑鞋</button>
    <button class="tab" data-tab="monthly" onclick="switchTab('monthly')">月跑量</button>
    <button class="tab" data-tab="agent" onclick="switchTab('agent')">AI 助手</button>
  </div>

  <div class="tab-panel active" data-panel="shoes">

    <div class="cards" id="summary-cards"></div>
    <div class="charts">
      <div class="chart-box"><h3>生命進度</h3><canvas id="chart-progress"></canvas></div>
      <div class="chart-box"><h3>每 km 成本比較</h3><canvas id="chart-cost"></canvas></div>
      <div class="chart-box"><h3>退役時間軸</h3><canvas id="chart-retire"></canvas></div>
      <div class="chart-box"><h3>月跑量佔比</h3><canvas id="chart-value"></canvas></div>
    </div>

    <div class="table-section">
      <div class="table-header">
        <h2>現役跑鞋</h2>
        <div style="display:flex; gap:8px; align-items:center;">
          <button class="btn btn-primary" onclick="openAddModal()">+ 新增跑鞋</button>
          <button class="btn btn-sm" style="background:#475569;color:#fff;" onclick="openExportModal()">匯出</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>品牌</th><th>鞋款</th><th>購買日期</th>
              <th>跑鞋里程</th><th>每km成本</th><th>預期里程</th><th>預期成本</th><th>生命進度</th>
              <th>月跑量</th><th>預估退役</th>
              <th>尺寸</th><th>買價</th><th>原價</th><th>折數</th><th></th>
            </tr>
          </thead>
          <tbody id="shoe-table"></tbody>
        </table>
      </div>
    </div>
    <div class="table-section">
      <div class="table-header">
        <h2>退役跑鞋</h2>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>品牌</th><th>鞋款</th><th>購買日期</th>
              <th>跑鞋里程</th><th>每km成本</th><th>預期里程</th><th>預期成本</th><th>生命進度</th>
              <th>月跑量</th><th>預估退役</th>
              <th>尺寸</th><th>買價</th><th>原價</th><th>折數</th><th></th>
            </tr>
          </thead>
          <tbody id="retired-table"></tbody>
        </table>
      </div>
    </div>

  </div><!-- /tab-panel shoes -->

  <div class="tab-panel" data-panel="monthly">

    <div class="charts charts-3col">
      <div class="chart-box">
        <div class="chart-title-row">
          <h3>年度總跑量</h3>
        </div>
        <canvas id="chart-yearly-total"></canvas>
      </div>
      <div class="chart-box">
        <div class="chart-title-row">
          <h3>年度月跑量</h3>
          <select id="year-select" class="year-select" onchange="onYearChange()"></select>
        </div>
        <canvas id="chart-monthly-year"></canvas>
      </div>
      <div class="chart-box">
        <div class="chart-title-row">
          <h3>滾動平均</h3>
          <select id="rolling-window" class="year-select" onchange="renderRollingAvgChart()">
            <option value="3">3 個月</option>
            <option value="6">6 個月</option>
            <option value="12" selected>12 個月</option>
          </select>
        </div>
        <canvas id="chart-rolling"></canvas>
      </div>
    </div>

    <div class="table-section">
      <div class="table-header">
        <h2>月跑量紀錄</h2>
      </div>
      <div class="inline-add">
        <select id="add-year"></select>
        <select id="add-month"></select>
        <input id="add-km" type="number" min="0" step="0.01" placeholder="km">
        <button class="btn btn-sm btn-primary" onclick="addMonthlyMileage()">新增</button>
        <span class="inline-error" id="add-error"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>年份</th><th>月份</th><th>跑量 (km)</th><th></th>
            </tr>
          </thead>
          <tbody id="monthly-table"></tbody>
        </table>
      </div>
    </div>

  </div><!-- /tab-panel monthly -->

  <!-- Agent Chat Panel -->
  <div class="tab-panel agent-panel" data-panel="agent">
    <div class="agent-config">
      <label style="font-size:13px;color:var(--text-dim);white-space:nowrap;">Model Provider</label>
      <select id="agent-model"></select>
      <button id="agent-refresh-btn" onclick="refreshAgentModels()">🔄 刷新模型列表</button>
    </div>
    <div class="agent-messages" id="agent-messages">
      <div class="agent-message bot">
        <div class="agent-msg-content">你好！我是跑鞋助手，可以幫你查詢跑鞋資料、分析跑量、推薦新鞋。有什麼想問的嗎？</div>
      </div>
    </div>
    <div class="agent-input-area">
      <textarea id="agent-input" rows="2" placeholder="問問你的跑鞋資料..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAgentMessage()}"></textarea>
      <button id="agent-send-btn" onclick="sendAgentMessage()">送出</button>
    </div>
  </div><!-- /tab-panel agent -->

</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">新增跑鞋</h2>
    <div class="form-row">
      <div class="form-group"><label>品牌</label><input id="f-brand" placeholder="Mizuno"></div>
      <div class="form-group"><label>鞋款</label><input id="f-model" placeholder="Wave Sky 7"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>購買日期</label><input id="f-date" type="date"></div>

<script>
// ====== HTML Escape (XSS protection) ======
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ====== API Base ======
const API_BASE = window.location.origin + '/api';

// ====== Auth State ======
let authToken = localStorage.getItem('token');
let currentUser = localStorage.getItem('username');

function setAuth(token, username) {
  authToken = token;
  currentUser = username;
  localStorage.setItem('token', token);
  localStorage.setItem('username', username);
}

function clearAuth() {
  authToken = null;
  currentUser = null;
  localStorage.removeItem('token');
  localStorage.removeItem('username');
}

function authHeaders() {
  const h = { 'Content-Type': 'application/json' };
  if (authToken) h['Authorization'] = 'Bearer ' + authToken;
  return h;
}

function showLoginView() {
  document.getElementById('auth-view').style.display = '';
  document.getElementById('app-view').style.display = 'none';
  showLoginForm();
  document.body.style.opacity = '1';
}

function showAppView() {
  document.getElementById('auth-view').style.display = 'none';
  document.getElementById('app-view').style.display = '';
  document.getElementById('user-label').textContent = currentUser || '';
  document.body.style.opacity = '1';
}

// 只在「從登入頁進入」時呼叫：清掉上一位使用者切到 AI 助手時留下的 inline 樣式，
// 並把分頁拉回跑鞋。F5 (init 用 stored token) 不會走這條路，所以不會被強制跳頁。
function resetAppLayout() {
  const appView = document.getElementById('app-view');
  appView.style.height = '';
  appView.style.overflow = '';
  appView.style.flexDirection = '';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'shoes'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.dataset.panel === 'shoes'));
}

// ====== Brand Colors ======
const BRAND_COLORS = {
  'Mizuno':        ['#38BDF8', '#7DD3FC', '#0EA5E9'],
  'New Balance':   ['#F87171', '#FCA5A5', '#EF4444'],
  'Adidas':        ['#FACC15', '#FDE047', '#EAB308'],
  'PUMA':          ['#4ADE80', '#86EFAC', '#22C55E'],
  'Nike':          ['#FB923C', '#FDBA74', '#F97316'],
  'Asics':         ['#A78BFA', '#C4B5FD', '#8B5CF6'],
  'Saucony':       ['#F472B6', '#F9A8D4', '#EC4899'],
  'Hoka':          ['#2DD4BF', '#5EEAD4', '#14B8A6'],
  'FILA':          ['#FB7185', '#FDA4AF', '#F43F5E'],
  'On':            ['#C084FC', '#D8B4FE', '#A855F7'],
  'Brooks':        ['#34D399', '#6EE7B7', '#10B981'],
  'Skechers':      ['#FBBF24', '#FDE68A', '#F59E0B'],
  'Under Armour':  ['#94A3B8', '#CBD5E1', '#64748B'],
  'Salomon':       ['#F97316', '#FDBA74', '#EA580C'],
};

const byDate = (a, b) => new Date(a.date) - new Date(b.date);

// ====== API Calls (with auth) ======
async function apiGet(url) {
  const res = await fetch(API_BASE + url, { headers: authHeaders() });
  if (res.status === 401) { clearAuth(); showLoginView(); throw new Error('Unauthorized'); }
  if (!res.ok) throw new Error('GET ' + url + ' failed: ' + res.status);
  return res.json();
}

async function apiPost(url, body) {
  const res = await fetch(API_BASE + url, {
    method: 'POST',
    headers: authHeaders(),
    body: JSON.stringify(body),
  });
  if (res.status === 401) { clearAuth(); showLoginView(); throw new Error('Unauthorized'); }
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.detail || ('POST ' + url + ' failed: ' + res.status));
  }
  return res.json();
}

async function apiPut(url, body) {
  const res = await fetch(API_BASE + url, {
    method: 'PUT',
    headers: authHeaders(),
    body: JSON.stringify(body),
  });
  if (res.status === 401) { clearAuth(); showLoginView(); throw new Error('Unauthorized'); }
  if (!res.ok) throw new Error('PUT ' + url + ' failed: ' + res.status);
  return res.json();
}

async function apiDelete(url) {
  const res = await fetch(API_BASE + url, { method: 'DELETE', headers: authHeaders() });
  if (res.status === 401) { clearAuth(); showLoginView(); throw new Error('Unauthorized'); }
  if (!res.ok) throw new Error('DELETE ' + url + ' failed: ' + res.status);
  return res.json();
}

// ====== Auth Handlers ======
function showLoginForm() {
  document.getElementById('login-form').style.display = '';
  document.getElementById('register-form').style.display = 'none';
  document.getElementById('change-form').style.display = 'none';
  hideAuthError();
}

function showRegisterForm() {
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('register-form').style.display = '';
  document.getElementById('change-form').style.display = 'none';
  hideRegError();
}

function showChangeForm() {
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('register-form').style.display = 'none';
  document.getElementById('change-form').style.display = '';
  hideChangeError();
}

function showAuthError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideAuthError() {
  document.getElementById('auth-error').style.display = 'none';
}

function showRegError(msg) {
  const el = document.getElementById('reg-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideRegError() {
  document.getElementById('reg-error').style.display = 'none';
}

function showChangeError(msg) {
  const el = document.getElementById('change-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideChangeError() {
  document.getElementById('change-error').style.display = 'none';
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.dataset.panel === name));
  localStorage.setItem('activeTab', name);  // 記住當前 tab，F5 後可還原
  if (name === 'monthly') {
    // Re-render charts after the panel becomes visible — Chart.js needs
    // real dimensions to size correctly (initial render runs while the
    // panel is display:none, leaving canvases at 0x0).
    requestAnimationFrame(() => renderMonthlyCharts());
  }
  // Agent tab: fill viewport height; other tabs: natural scroll
  const appView = document.getElementById('app-view');
  if (name === 'agent') {
    appView.style.height = '100vh';
    appView.style.overflow = 'hidden';
    appView.style.display = 'flex';
    appView.style.flexDirection = 'column';
  } else {
    appView.style.height = '';
    appView.style.overflow = '';
    appView.style.display = '';
    appView.style.flexDirection = '';
  }
}

const ERROR_ZH = {
  'User not found': '帳號不存在',
  'Incorrect password': '密碼不正確',
  'Username already registered': '帳號已被註冊',
  'Password must be at least 4 characters': '密碼至少 4 個字元',
  'Shoe not found': '跑鞋不存在',
};
function translateError(detail) {
  return ERROR_ZH[detail] || detail;
}

async function handleLogin() {
  hideAuthError();
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  if (!username || !password) { showAuthError('請輸入帳號和密碼'); return; }
  try {
    const res = await fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) {
      let msg = '登入失敗';
      try { const err = await res.json(); msg = translateError(err.detail) || msg; } catch {}
      if (res.status === 500) msg = '伺服器錯誤，請稍後再試';
      throw new Error(msg);
    }
    const data = await res.json();
    setAuth(data.access_token, username);
    resetAgentChat();  // 保險：確保進入時對話是乾淨的，不殘留上一位使用者
    resetAppLayout();  // 清掉上一位使用者切到 AI 助手留下的 inline 樣式，並回到跑鞋頁
    showAppView();
    loadData();
  } catch (e) {
    showAuthError(e.message);
  }
}

async function handleRegister() {
  hideRegError();
  const username = document.getElementById('reg-username').value.trim();
  const password = document.getElementById('reg-password').value;
  const password2 = document.getElementById('reg-password2').value;
  if (!username || !password) { showRegError('請輸入帳號和密碼'); return; }
  if (password.length < 4) { showRegError('密碼至少 4 個字元'); return; }
  if (password !== password2) { showRegError('兩次密碼不一致'); return; }
  try {
    const regRes = await fetch(API_BASE + '/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!regRes.ok) {
      let msg = '註冊失敗';
      try { const err = await regRes.json(); msg = translateError(err.detail) || msg; } catch {}
      if (regRes.status === 500) msg = '伺服器錯誤，請稍後再試';
      throw new Error(msg);
    }
    // Auto-login after registration
    const loginRes = await fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!loginRes.ok) {
      showLoginForm();
      showAuthError('註冊成功！請登入');
      return;
    }
    const data = await loginRes.json();
    setAuth(data.access_token, username);
    resetAppLayout();  // 清掉殘留 inline 樣式並回到跑鞋頁
    showAppView();
    loadData();
  } catch (e) {
    showRegError(e.message);
  }
}

function handleLogout() {
  clearAuth();
  resetAgentChat();
  showLoginView();
}

async function handleChangePassword() {
  hideChangeError();
  const username = document.getElementById('change-username').value.trim();
  const oldPassword = document.getElementById('change-old-password').value;
  const password = document.getElementById('change-new-password').value;
  const password2 = document.getElementById('change-new-password2').value;
  if (!username) { showChangeError('請輸入帳號'); return; }
  if (!oldPassword) { showChangeError('請輸入舊密碼'); return; }
  if (!password) { showChangeError('請輸入新密碼'); return; }
  if (password.length < 4) { showChangeError('密碼至少 4 個字元'); return; }
  if (password !== password2) { showChangeError('兩次密碼不一致'); return; }
  try {
    const res = await fetch(API_BASE + '/auth/change-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, old_password: oldPassword, new_password: password }),
    });
    if (!res.ok) {
      let msg = '重設失敗';
      try { const err = await res.json(); msg = translateError(err.detail) || msg; } catch {}
      throw new Error(msg);
    }
    showLoginForm();
    showAuthError('密碼已重設，請重新登入');
  } catch (e) {
    showChangeError(e.message);
  }
}

// ====== Data State ======
let shoes = [];
let retiredShoes = [];
let monthlyMileages = [];
let selectedYear = null;

async function loadData() {
  try {
    const [active, retired, monthly] = await Promise.all([
      apiGet('/shoes/active'),
      apiGet('/shoes/retired'),
      apiGet('/monthly-mileage'),
    ]);
    shoes = active;
    retiredShoes = retired;
    monthlyMileages = monthly;
  } catch (e) {
    console.error('載入資料失敗:', e);
    shoes = [];
    retiredShoes = [];
    monthlyMileages = [];
  }
  // Default selected year to the most recent year present
  if (monthlyMileages.length > 0) {
    const years = [...new Set(monthlyMileages.map(m => m.year))].sort((a, b) => b - a);
    if (!selectedYear || !years.includes(selectedYear)) {
      selectedYear = years[0];
    }
  } else {
    selectedYear = new Date().getFullYear();
  }
  render();
}

// ====== Calculations ======
function calc(shoe) {
  const { price, orig_price, mileage, expected_mileage, monthly_km } = shoe;
  const discount = orig_price > 0 ? price / orig_price : 0;
  const costPerKm = mileage > 0 ? price / mileage : null;
  const expectedCost = expected_mileage > 0 ? price / expected_mileage : 0;
  const lifeProgress = expected_mileage > 0 ? mileage / expected_mileage : 0;
  const remainingMileage = Math.max(0, expected_mileage - mileage);
  const remainingMonths = monthly_km > 0 ? remainingMileage / monthly_km : null;
  const today = new Date();
  let retireDate = null;
  if (remainingMonths !== null) {
    const remainDays = remainingMonths * 30;
    retireDate = new Date(today.getTime() + remainDays * 86400000);
  }
  return { discount, costPerKm, expectedCost, lifeProgress, remainingMileage, remainingMonths, retireDate };
}

// ====== Formatting ======
function fmtPct(v) { return (v * 100).toFixed(2) + '%'; }
function fmtMoney(v) { return '$' + Math.round(v).toLocaleString(); }
function fmtDate(d) { if (!d) return '-'; return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`; }
function fmtCostPerKm(v) { return v !== null ? '$' + v.toFixed(2) : '-'; }

function progressColor(pct) {
  if (pct < 0.2) return '#16a34a';
  if (pct < 0.4) return '#4ade80';
  if (pct < 0.6) return '#eab308';
  if (pct < 0.8) return '#f97316';
  return '#ef4444';
}

function brandColor(brand, seq) {
  const palette = BRAND_COLORS[brand];
  if (!palette) return '#6366f1';
  return palette[seq % palette.length] || palette[0];
}

// ====== Render ======
function render() {
  const now = new Date();
  const todayStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
  document.getElementById('today-label').textContent = '資料日期：' + todayStr;

  shoes.sort(byDate);
  retiredShoes.sort(byDate);

  renderCards();
  renderTable();
  renderRetiredTable();
  renderMonthlyTable();
  if (typeof Chart !== 'undefined') {
    renderCharts();
    renderMonthlyCharts();
  }
}

function renderCards() {
  const allShoes = [...shoes, ...retiredShoes];
  let totalMileage = 0, totalPrice = 0;
  allShoes.forEach(s => {
    totalMileage += s.mileage;
    totalPrice += s.price;
  });
  const avgCostPerKm = totalMileage > 0 ? totalPrice / totalMileage : 0;

  const cards = [
    { label: '現役跑鞋', value: shoes.length + '/' + allShoes.length, sub: '雙' },
    { label: '總里程', value: totalMileage.toLocaleString(), sub: 'km' },
    { label: '總花費', value: '$' + totalPrice.toLocaleString(), sub: '花費合計' },
    { label: '平均每km成本', value: '$' + avgCostPerKm.toFixed(2), sub: '總花費 / 總里程' },
  ];
  document.getElementById('summary-cards').innerHTML = cards.map(c =>
    `<div class="card"><div class="card-label">${c.label}</div><div class="card-value">${c.value}</div><div class="card-sub">${c.sub}</div></div>`
  ).join('');
}

function renderTable() {
  const tbody = document.getElementById('shoe-table');
  let brandSeq = {};
  tbody.innerHTML = shoes.map((s, i) => {
    const c = calc(s);
    const pc = progressColor(c.lifeProgress);
    brandSeq[s.brand] = (brandSeq[s.brand] || 0);
    const bc = brandColor(s.brand, brandSeq[s.brand]);
    brandSeq[s.brand]++;
    return `<tr>
      <td><span class="brand-dot" style="background:${bc}"></span><span class="brand">${esc(s.brand)}</span></td>
      <td>${esc(s.model)}</td>
      <td>${esc(s.date.replace(/-/g,'/'))}</td>
      <td class="editable" ondblclick="inlineEditRow(shoes, ${i}, 'mileage', this)">${s.mileage}</td>
      <td>${fmtCostPerKm(c.costPerKm)}</td>
      <td class="editable" ondblclick="inlineEditRow(shoes, ${i}, 'expected_mileage', this)">${s.expected_mileage}</td>
      <td>${fmtCostPerKm(c.expectedCost)}</td>
      <td style="color:${pc}">${fmtPct(c.lifeProgress)}</td>
      <td class="editable" ondblclick="inlineEditRow(shoes, ${i}, 'monthly_km', this)">${s.monthly_km}</td>
      <td>${fmtDate(c.retireDate)}</td>
      <td>${esc(s.size)}</td>
      <td>${fmtMoney(s.price)}</td>
      <td>${fmtMoney(s.orig_price)}</td>
      <td>${fmtPct(c.discount)}</td>
      <td>
        <button class="btn btn-sm btn-edit" onclick="openEditModal(${i})">編輯</button>
      </td>
    </tr>`;
  }).join('');
}

function renderRetiredTable() {
  const tbody = document.getElementById('retired-table');
  let brandSeq = {};
  tbody.innerHTML = retiredShoes.map((s, i) => {
    const c = calc(s);
    const pc = progressColor(c.lifeProgress);
    brandSeq[s.brand] = (brandSeq[s.brand] || 0);
    const bc = brandColor(s.brand, brandSeq[s.brand]);
    brandSeq[s.brand]++;
    return `<tr>
      <td><span class="brand-dot" style="background:${bc}"></span><span class="brand">${esc(s.brand)}</span></td>
      <td>${esc(s.model)}</td>
      <td>${esc(s.date.replace(/-/g,'/'))}</td>
      <td class="editable" ondblclick="inlineEditRow(retiredShoes, ${i}, 'mileage', this)">${s.mileage}</td>
      <td>${fmtCostPerKm(c.costPerKm)}</td>
      <td class="editable" ondblclick="inlineEditRow(retiredShoes, ${i}, 'expected_mileage', this)">${s.expected_mileage}</td>
      <td>${fmtCostPerKm(c.expectedCost)}</td>
      <td style="color:${pc}">${fmtPct(c.lifeProgress)}</td>
      <td>-</td>
      <td>已退役</td>
      <td>${esc(s.size)}</td>
      <td>${fmtMoney(s.price)}</td>
      <td>${fmtMoney(s.orig_price)}</td>
      <td>${fmtPct(c.discount)}</td>
      <td><button class="btn btn-sm btn-edit" onclick="openRetiredEditModal(${i})">編輯</button></td>
    </tr>`;
  }).join('');
}

// ====== Monthly Mileage Table ======
function renderMonthlyTable() {
  const tbody = document.getElementById('monthly-table');
  if (monthlyMileages.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-dim);padding:24px;">尚無月跑量紀錄，使用上方表單新增</td></tr>';
    return;
  }
  tbody.innerHTML = monthlyMileages.map((m, i) => `
    <tr>
      <td>${m.year}</td>
      <td>${m.month}</td>
      <td class="editable" ondblclick="inlineEditMonthly(${i},'km',this)">${m.km.toFixed(2)}</td>
      <td>
        <button class="btn btn-sm btn-edit" onclick="editMonthlyMileage(${i})">編輯</button>
        <button class="btn btn-sm btn-delete" onclick="deleteMonthlyMileage(${i})">刪除</button>
      </td>
    </tr>
  `).join('');
}

async function inlineEditMonthly(idx, field, el) {
  const current = monthlyMileages[idx][field];
  const input = document.createElement('input');
  input.type = 'number';
  input.className = 'inline-input';
  input.step = '0.01';
  input.min = '0';
  input.value = current;
  input.focus();
  const commit = async () => {
    const val = parseFloat(input.value);
    if (!isNaN(val) && val >= 0) {
      monthlyMileages[idx][field] = val;
      try {
        await apiPut('/monthly-mileage/' + monthlyMileages[idx].id, { km: val });
      } catch (e) {
        console.error('更新失敗:', e);
      }
    }
    render();
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') render(); });
  el.innerHTML = '';
  el.appendChild(input);
  input.focus();
}

function openExportModal() {

async function doExport() {
  const format = document.getElementById('export-format').value;
  const mode = document.getElementById('export-mode').value;
  const backendMode = mode === 'retired' ? 'retired' : (mode === 'all' ? 'all' : 'active');
  const displayMode = backendMode === 'retired' ? '退役' : (backendMode === 'all' ? '全部' : '現役');

  const btn = document.querySelector('#export-modal .btn-primary');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '匯出中';

  try {
    const params = new URLSearchParams({
      format: format,
      mode: backendMode
    });

    const res = await fetch(API_BASE + '/export?' + params.toString(), {
      headers: authHeaders()
    });

    if (res.status === 401) {
      clearAuth();
      showLoginView();
      throw new Error('Unauthorized');
    }

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `匯出失敗: ${res.status}`);
    }

    // Get filename from Content-Disposition header
    const disposition = res.headers.get('Content-Disposition');
    let filename = `running_shoes_${backendMode}_${new Date().toISOString().slice(0,10)}.${format}`;
    if (disposition) {
      const match = disposition.match(/filename="([^"]+)"/);
      if (match) filename = match[1];
    }

    // Download the file
    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    window.URL.revokeObjectURL(url);
    document.body.removeChild(a);

    closeExportModal();

  } catch (e) {
    console.error('匯出失敗:', e);
    document.getElementById('export-error').textContent = '匯出失敗：' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

function renderMonthlyCharts() {

function populateYearSelect() {
  const sel = document.getElementById('year-select');
  const years = [...new Set(monthlyMileages.map(m => m.year))].sort((a, b) => b - a);
  if (years.length === 0) {
    sel.innerHTML = '<option value="">無資料</option>';
    selectedYear = null;
    return;
  }
  if (!selectedYear || !years.includes(selectedYear)) {
    selectedYear = years[0];
  }
  sel.innerHTML = years.map(y => `<option value="${y}" ${y === selectedYear ? 'selected' : ''}>${y}</option>`).join('');
}

function onYearChange() {
  const sel = document.getElementById('year-select');

  renderMonthlyYearChart();
}

function renderRollingAvgChart() {
  if (chartInstances.rolling) { chartInstances.rolling.destroy(); delete chartInstances.rolling; }
  if (monthlyMileages.length === 0) return;

  const sel = document.getElementById('rolling-window');
  const windowSize = parseInt(sel.value, 10) || 12;

  const sorted = [...monthlyMileages].sort((a, b) => (a.year - b.year) || (a.month - b.month));
  const labels = sorted.map(m => `${m.year}/${String(m.month).padStart(2, '0')}`);

  // Trailing N-month rolling average (only computed once window has N months of data)
  const rolling = sorted.map((m, i) => {
    if (i < windowSize - 1) return null;
    const start = i - windowSize + 1;
    const win = sorted.slice(start, i + 1);
    const sum = win.reduce((s, w) => s + w.km, 0);
    return parseFloat((sum / win.length).toFixed(2));
  });

  chartInstances.rolling = new Chart(document.getElementById('chart-rolling'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: `${windowSize} 個月滾動平均 (km)`,
        data: rolling,
        borderColor: '#22c55e',
        backgroundColor: 'rgba(34, 197, 94, 0.15)',
        fill: true,
        tension: 0.3,
        pointRadius: 2,
        pointHoverRadius: 5,
        pointBackgroundColor: '#22c55e',
        borderWidth: 2,
        spanGaps: false,
      }]
    },
    options: {
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => `平均 ${ctx.raw.toFixed(2)} km` } }
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#8b8d9a', font: { size: 10 }, maxRotation: 45, minRotation: 45 } },
        y: { grid: { color: '#2a2d3e' }, ticks: { color: '#8b8d9a', callback: v => v + ' km' }, beginAtZero: true }
      }
    }
  });
}

function renderYearlyTotalChart() {
  if (chartInstances.yearlyTotal) { chartInstances.yearlyTotal.destroy(); delete chartInstances.yearlyTotal; }
  if (monthlyMileages.length === 0) return;

  const yearMap = new Map();
  monthlyMileages.forEach(m => {
    yearMap.set(m.year, (yearMap.get(m.year) || 0) + m.km);
  });
  const years = [...yearMap.keys()].sort((a, b) => a - b);
  const totals = years.map(y => parseFloat(yearMap.get(y).toFixed(2)));

  chartInstances.yearlyTotal = new Chart(document.getElementById('chart-yearly-total'), {
    type: 'bar',
    data: {
      labels: years.map(String),
      datasets: [{
        label: '年總跑量',
        data: totals,
        backgroundColor: '#6366f1',
        borderRadius: 4,
      }]
    },
    options: {
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => ctx.raw.toFixed(2) + ' km' } }
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#8b8d9a' } },
        y: { grid: { color: '#2a2d3e' }, ticks: { color: '#8b8d9a', callback: v => v + ' km' }, beginAtZero: true, suggestedMax: Math.ceil(Math.max(...totals) * 1.15 / 50) * 50 }
      }
    },
    plugins: [{
      id: 'valueOnTop',
      afterDatasetsDraw(chart) {
        const { ctx } = chart;
        const meta = chart.getDatasetMeta(0);
        meta.data.forEach((bar, i) => {
          const v = totals[i];
          if (!bar) return;
          ctx.save();
          ctx.fillStyle = '#e4e4e7';
          ctx.font = 'bold 11px "Segoe UI", system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(v.toFixed(0), bar.x, bar.y - 6);
          ctx.restore();
        });
      }
    }]
  });
}

function renderMonthlyYearChart() {
  if (chartInstances.monthlyYear) { chartInstances.monthlyYear.destroy(); delete chartInstances.monthlyYear; }
  const sel = document.getElementById('year-select');
  const year = parseInt(sel.value, 10);
  if (!year) return;

  const yearData = monthlyMileages.filter(m => m.year === year);
  const monthMap = new Map(yearData.map(m => [m.month, m.km]));
  const labels = Array.from({length: 12}, (_, i) => (i + 1) + '月');
  const values = Array.from({length: 12}, (_, i) => monthMap.get(i + 1) ?? 0);

  const total = values.reduce((a, b) => a + b, 0);
  // Divide by months that actually have a record (user logs 0 for inactive months)
  const monthsWithData = yearData.length;
  const avg = monthsWithData > 0 ? total / monthsWithData : 0;

  chartInstances.monthlyYear = new Chart(document.getElementById('chart-monthly-year'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: year + ' 年月跑量 (km)',
        data: values,
        backgroundColor: '#22c55e',
        borderRadius: 4,
      }]
    },
    options: {
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => ctx.raw.toFixed(2) + ' km' } }
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#8b8d9a', font: { size: 11 } } },
        y: { grid: { color: '#2a2d3e' }, ticks: { color: '#8b8d9a', callback: v => v + ' km' }, beginAtZero: true }
      }
    },
    plugins: [{
      id: 'avgLine',
      afterDraw(chart) {
        const { ctx, chartArea, scales: { y } } = chart;
        if (avg <= 0) return;
        const yPx = y.getPixelForValue(avg);
        if (yPx < chartArea.top || yPx > chartArea.bottom) return;
        ctx.save();
        ctx.strokeStyle = '#eab308';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 4]);
        ctx.beginPath();
        ctx.moveTo(chartArea.left, yPx);
        ctx.lineTo(chartArea.right, yPx);
        ctx.stroke();
        ctx.fillStyle = '#eab308';
        ctx.font = '11px "Segoe UI", system-ui, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText('月均 ' + avg.toFixed(1) + ' km', chartArea.right - 6, yPx - 6);
        ctx.restore();
      }
    }]
  });
}

// 現役與退役共用的表格內即時編輯：差別只在操作哪個陣列（arr）
async function inlineEditRow(arr, idx, field, el) {
  const input = document.createElement('input');
  input.type = 'number';
  input.className = 'inline-input';
  input.value = arr[idx][field];
  const commit = async () => {
    const val = parseFloat(input.value);
    if (!isNaN(val) && val >= 0) {
      arr[idx][field] = val;
      try {
        await apiPut('/shoes/' + arr[idx].id, arr[idx]);
      } catch (e) {
        console.error('更新失敗:', e);
      }
    }
    render();
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') render(); });
  el.innerHTML = '';
  el.appendChild(input);
  input.focus();
}

  openForCreate() {
    this.mode = 'create';
    this.shoe = null;
    this._resetForm();
    this._updateUI({ title: '新增跑鞋', showDelete: false, showMove: false, monthly: 60, monthlyVisible: true });
    this._show();
  }

  openForEdit(shoe, isRetired) {
    this.mode = isRetired ? 'editRetired' : 'editActive';
    this.shoe = shoe;
    this._fillForm(shoe);
    this._updateUI({
      title: isRetired ? '編輯退役跑鞋' : '編輯跑鞋',
      showDelete: true,
      showMove: true,
      moveText: isRetired ? '移至現役' : '移至退役',
      monthly: isRetired ? 0 : shoe.monthly_km,
      monthlyVisible: !isRetired
    });
    this._show();
  }

  // ── 內部邏輯 ──────────────────────────────────────────────
  _resetForm() {
    Object.values(this.formIds).forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-date').value = new Date().toISOString().slice(0, 10);
    document.getElementById('f-expected').value = 800;
  }

  _fillForm(s) {
    Object.entries(this.formIds).forEach(([k, id]) => {
      const field = k === 'orig' ? 'orig_price' : k === 'expected' ? 'expected_mileage' : k;
      document.getElementById(id).value = s[field] ?? '';
    });
  }

  _updateUI({ title, showDelete, showMove, moveText, monthly, monthlyVisible }) {
    this.titleEl.textContent = title;
    this.btnDelete.style.display = showDelete ? 'inline-block' : 'none';
    this.btnMove.style.display = showMove ? 'inline-block' : 'none';
    this.btnMove.textContent = moveText || '';
    this.monthlyRow.style.display = monthlyVisible ? '' : 'none';
    document.getElementById('f-monthly').value = monthly;
  }

  _show() { this.el.classList.add('active'); }
  close() { this.el.classList.remove('active'); this.shoe = null; }

  _payload() {
    const get = id => document.getElementById(id).value;
    const num = id => parseFloat(get(id)) || 0;
    return {
      brand: get('f-brand').trim(),
      model: get('f-model').trim(),
      date: get('f-date'),
      size: get('f-size').trim(),
      price: num('f-price'),
      orig_price: num('f-orig'),
      mileage: num('f-mileage'),
      expected_mileage: num('f-expected'),
      monthly_km: num('f-monthly'),
      is_retired: this.mode === 'editRetired'
    };
  }

  async submit() {
    const data = this._payload();
    if (!data.brand || !data.model || !data.date) return alert('請填寫品牌、鞋款、日期');
    try {
      if (this.mode === 'create') await apiPost('/shoes', data);
      else await apiPut('/shoes/' + this.shoe.id, data);
    } catch (e) { return alert('儲存失敗'); }
    this.close();
    await loadData();
  }

  async delete() {
    if (!confirm(`確定刪除 ${this.shoe.brand} ${this.shoe.model}？此動作無法復原。`)) return;
    try { await apiDelete('/shoes/' + this.shoe.id); }
    catch { return alert('刪除失敗'); }
    this.close();
    await loadData();
  }

  async move() {
    const targetRetired = this.mode === 'editActive';
    if (!confirm(`確定要移至${targetRetired ? '退役' : '現役'}？`)) return;
    try {
      await apiPut('/shoes/' + this.shoe.id, {
        ...this.shoe,
        is_retired: targetRetired,
        monthly_km: targetRetired ? 0 : 60
      });
    } catch { return alert('移動失敗'); }
    this.close();
    await loadData();
  }
}

// ====== Agent / Chat ======
let agentHistory = [];

const AGENT_GREETING = '你好！我是跑鞋助手，可以幫你查詢跑鞋資料、分析跑量、推薦新鞋。有什麼想問的嗎？';

// 清空對話（登出/切換帳號時呼叫）：重設上下文陣列 + 還原畫面為初始問候語，
// 避免前一個使用者的對話殘留給下一位（隱私）。
function resetAgentChat() {
  agentHistory = [];
  const container = document.getElementById('agent-messages');
  if (container) {
    container.innerHTML =
      '<div class="agent-message bot"><div class="agent-msg-content">' +
      AGENT_GREETING + '</div></div>';
  }
}

async function loadAgentModels() {
  try {
    const providers = await apiGet('/agent/providers');
    const orProv = providers.find(p => p.id === 'openrouter');
    if (!orProv) return;
    const modelSel = document.getElementById('agent-model');
    modelSel.innerHTML = orProv.models.map(m =>
      `<option value="${m.id}">${m.display}</option>`
    ).join('');
  } catch (e) {
    console.error('載入模型清單失敗:', e);
  }
}

async function refreshAgentModels() {
  const btn = document.getElementById('agent-refresh-btn');
  btn.disabled = true;
  btn.textContent = '⏳';
  try {
    await apiPost('/agent/models/refresh', {});
    await loadAgentModels();
  } catch (e) {
    alert('刷新模型列表失敗：' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '🔄 刷新模型列表';
  }
}

function renderMarkdown(text) {
  if (typeof marked !== 'undefined' && marked.parse) {
    const raw = marked.parse(text, { breaks: true, gfm: true });
    // Sanitize: only allow safe tags
    const div = document.createElement('div');
    div.innerHTML = raw;
    // Remove script/iframe/etc
    const scripts = div.querySelectorAll('script, iframe, style, img');
    scripts.forEach(s => s.remove());
    return div.innerHTML;
  }
  // fallback: escape HTML and preserve line breaks
  const esc = text.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
  return esc.replace(/\n/g, '<br>');
}

function addAgentMessage(role, text) {
  const container = document.getElementById('agent-messages');
  const div = document.createElement('div');
  div.className = 'agent-message ' + role;
  const content = document.createElement('div');
  content.className = 'agent-msg-content';
  if (role === 'bot') {
    content.innerHTML = renderMarkdown(text);
  } else {
    content.textContent = text;
  }
  div.appendChild(content);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return content;
}

function addRetryButton() {
  const container = document.getElementById('agent-messages');
  const btn = document.createElement('div');
  btn.className = 'agent-retry-btn';
  btn.innerHTML = '↻ 重新產生';
  btn.onclick = () => sendAgentMessage(lastUserText);
  container.appendChild(btn);
  container.scrollTop = container.scrollHeight;
}

function setAgentLoading(loading) {
  const btn = document.getElementById('agent-send-btn');
  const input = document.getElementById('agent-input');
  btn.disabled = loading;
  input.disabled = loading;
  if (loading) {
    btn.textContent = '思考中...';
  } else {
    btn.textContent = '送出';
  }
}

let lastUserText = '';

async function sendAgentMessage(retryText) {
  const input = document.getElementById('agent-input');
  const text = retryText || input.value.trim();
  if (!text) return;
  const isRetry = !!retryText;

  // Store for retry
  lastUserText = text;

  // Clear retry buttons from previous failed attempts
  document.querySelectorAll('.agent-retry-btn').forEach(el => el.remove());

  if (!isRetry) {
    // Normal send: add user message, clear input
    addAgentMessage('user', text);
    input.value = '';
  } else {
    // Retry: remove everything after the last user message
    const container = document.getElementById('agent-messages');
    const userMsgs = container.querySelectorAll('.agent-message.user');
    const lastUser = userMsgs[userMsgs.length - 1];
    if (lastUser) {
      while (lastUser.nextElementSibling) {
        lastUser.nextElementSibling.remove();
      }
    }
    // Pop the last failed assistant response from history
    if (agentHistory.length >= 2 && agentHistory[agentHistory.length - 1].role === 'assistant') {
      agentHistory.pop();
    }
  }

  const container = document.getElementById('agent-messages');

  // Create tool status container (hidden until first tool event)
  let toolStatusDiv = null;
  let thinkingDiv = null;

  // Create bot message placeholder
  const botDiv = document.createElement('div');
  botDiv.className = 'agent-message bot agent-typing';
  const botContent = document.createElement('div');
  botContent.className = 'agent-msg-content';
  botContent.innerHTML = '';
  botDiv.appendChild(botContent);
  container.appendChild(botDiv);

  setAgentLoading(true);

  const provider = 'openrouter';
  const model = document.getElementById('agent-model').value;

  try {
    const res = await fetch(API_BASE + '/agent/chat/stream', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + authToken,
      },
      body: JSON.stringify({
        user_message: text,
        history: agentHistory,
        provider: provider,
        model: model,
      }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (!data) continue;

        try {
          const event = JSON.parse(data);
          if (event.type === 'reasoning') {
            // New reasoning round → reset both containers so new tools go
            // into a fresh group that sits AFTER this thinking bubble
            if (!thinkingDiv) {
              thinkingDiv = document.createElement('div');
              thinkingDiv.className = 'agent-thinking';
              thinkingDiv.textContent = '💭 ';
              container.insertBefore(thinkingDiv, botDiv);
              toolStatusDiv = null;  // next tool event creates a new group
            }
            thinkingDiv.textContent += event.text;
            container.scrollTop = container.scrollHeight;
          } else if (event.type === 'tool') {
            // Finalize current thinking bubble
            thinkingDiv = null;
            // Create a new tool group if needed (inserted after the thinking bubble)
            if (!toolStatusDiv) {
              toolStatusDiv = document.createElement('div');
              toolStatusDiv.className = 'agent-tools';
              container.insertBefore(toolStatusDiv, botDiv);
            }
            // Use a sequence counter so each tool item has a unique ID
            const seq = toolStatusDiv.children.length;
            const toolItem = document.createElement('div');
            toolItem.className = 'tool-item';
            toolItem.dataset.toolSeq = seq;
            toolItem.innerHTML = '<span class="tool-icon">🔍</span> <span class="tool-name">' + (event.name || '查詢中') + '</span>';
            toolStatusDiv.appendChild(toolItem);
            container.scrollTop = container.scrollHeight;
          } else if (event.type === 'tool_done') {
            // 個別工具完成 → 打勾該 tool group 中第一個仍 🔍 的工具
            const group = toolStatusDiv;
            if (group) {
              const pending = group.querySelector('.tool-item:not(.done)');
              if (pending) {
                pending.classList.add('done');
                pending.querySelector('.tool-icon').textContent = '✅';
              }
            }
          } else if (event.type === 'reasoning_start') {
            // 串流過程中發現 LLM 要呼叫工具 → 把已顯示的文字移到思考氣泡
            if (fullText) {
              thinkingDiv = document.createElement('div');
              thinkingDiv.className = 'agent-thinking';
              thinkingDiv.textContent = '💭 ' + fullText;
              container.insertBefore(thinkingDiv, botDiv);
              toolStatusDiv = null;
            }
            fullText = '';
            botContent.textContent = '';
          } else if (event.type === 'token') {
            // First token — allow next reasoning round
            thinkingDiv = null;
            fullText += event.text;
            // During streaming, use textContent to avoid broken partial markdown rendering
            botContent.textContent = fullText;
            container.scrollTop = container.scrollHeight;
          } else if (event.type === 'error') {
            fullText += '\n\n⚠️ ' + event.text;
            botContent.textContent = fullText;
          }
        } catch (e) {
          console.error('解析 SSE 事件失敗:', e);
        }
      }
    }

    botDiv.classList.remove('agent-typing');
    if (fullText) {
      botContent.innerHTML = renderMarkdown(fullText);
      if (!isRetry) agentHistory.push({ role: 'user', content: text });
      agentHistory.push({ role: 'assistant', content: fullText });
    } else {
      botContent.textContent = '（模型沒有回應，請再試一次或更換模型。）';
      if (!isRetry) agentHistory.push({ role: 'user', content: text });
    }
    addRetryButton(); // 不管成功失敗都顯示重試
  } catch (e) {
    botContent.textContent = '⚠️ 連線失敗，請確認後端服務已啟動。';
    botDiv.classList.remove('agent-typing');
    console.error('Agent 請求失敗:', e);
    addRetryButton();
  }

  setAgentLoading(false);
}

// Check stored token on load
async function init() {
  populateAddSelects();
  loadAgentModels();
  if (authToken) {
    try {
      await fetch(API_BASE + '/auth/me', { headers: authHeaders() });
      showAppView();
      // 還原 F5 之前的 tab（init 走 stored token，沒經過 resetAppLayout，
      // 所以 HTML 預設的「跑鞋」class 仍會保留，必須用 switchTab 強制切回去）
      const savedTab = localStorage.getItem('activeTab');
      if (savedTab && savedTab !== 'shoes') switchTab(savedTab);
      loadData();
    } catch {
      clearAuth();
      showLoginView();
    }
  } else {
    showLoginView();
  }
  document.body.style.opacity = '1';
}

init();

// Resize handler — re-apply agent tab layout on window resize
window.addEventListener('resize', () => {
  const activePanel = document.querySelector('.tab-panel.active');
  if (activePanel && activePanel.dataset.panel === 'agent') {
    const appView = document.getElementById('app-view');
    appView.style.height = '100vh';
  }
});
</script>
