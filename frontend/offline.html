<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <title>目前離線｜跑鞋追蹤</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0f1117; color: #e4e4e7; font-family: system-ui, sans-serif; }
    main { width: min(420px, 100%); padding: 28px; border: 1px solid #2a2d3e; border-radius: 16px; background: #1a1d2e; text-align: center; }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { margin: 0 0 22px; color: #a1a1aa; line-height: 1.7; }
    button { border: 0; border-radius: 10px; padding: 10px 18px; background: #6366f1; color: white; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>目前沒有網路連線</h1>
    <p>重新連線後即可繼續查看跑量、記錄跑步與產生月報。</p>
    <button type="button" onclick="location.reload()">重新連線</button>
  </main>
</body>
</html>
