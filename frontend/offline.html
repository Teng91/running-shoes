<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07090c">
  <title>目前離線｜跑鞋追蹤</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #07090c; color: #edf1f5; font-family: 'Segoe UI', system-ui, sans-serif; }
    main { width: min(420px, 100%); padding: 28px; border: 1px solid #1d242d; border-radius: 18px; background: #0f1318; box-shadow: inset 0 2px 0 #c8ff3c; text-align: center; }
    h1 { margin: 0 0 12px; font-size: 24px; font-weight: 800; letter-spacing: .04em; }
    p { margin: 0 0 22px; color: #8893a2; line-height: 1.7; }
    .retry { display: inline-block; border-radius: 10px; padding: 10px 18px; background: #c8ff3c; color: #0b1100; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>目前沒有網路連線</h1>
    <p>重新連線後即可繼續查看跑量、記錄跑步與產生月報。</p>
    <!-- An empty href reloads this URL without script, so the strict CSP above holds. -->
    <a class="retry" href="">重新連線</a>
  </main>
</body>
</html>
