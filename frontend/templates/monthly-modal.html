<!-- Monthly Mileage Modal -->
<div class="modal-overlay" id="monthly-modal">
  <div class="modal" style="width: 360px;">
    <h2 id="monthly-modal-title">新增月份</h2>
    <div class="form-row">
      <div class="form-group">
        <label for="m-year">年份</label>
        <select id="m-year"></select>
      </div>
      <div class="form-group">
        <label for="m-month">月份</label>
        <select id="m-month"></select>
      </div>
    </div>
    <div class="form-group">
      <label for="m-km">跑量 (km)</label>
      <input id="m-km" type="number" placeholder="0" min="0" step="0.01">
    </div>
    <div class="auth-error" id="monthly-error"></div>
    <div class="modal-actions">
      <div class="modal-actions-primary">
        <button class="btn btn-cancel" onclick="closeMonthlyModal()">取消</button>
        <button class="btn btn-primary" id="save-monthly-btn" onclick="saveMonthlyMileage()">儲存</button>
      </div>
    </div>
  </div>
</div>
