<div class="modal-overlay" id="workspace-modal">
  <div class="modal workspace-modal">
    <h2 id="workspace-modal-title">資料與同步</h2>
    <p id="workspace-owner" class="workspace-help"></p>
    <section aria-labelledby="queue-title">
      <h3 id="queue-title">本機待同步跑步</h3>
      <p class="workspace-help">尚未同步的紀錄不計入統計。連線並開啟 App／回到前景後會重試；需要處理時請明確重新配對鞋款。關閉 App 後仍保留，清除網站資料或瀏覽器回收儲存空間則會移除，請定期備份。</p>
      <button class="btn btn-edit" onclick="syncWorkspace()">立即同步</button>
      <div id="workspace-queue" role="status" aria-live="polite"></div>
    </section>
    <section aria-labelledby="drafts-title"><h3 id="drafts-title">未完成的編輯草稿</h3><div id="workspace-drafts"></div></section>
    <section aria-labelledby="restore-title">
      <h3 id="restore-title">帳號備份合併還原</h3>
      <p class="workspace-help">先下載完整備份，再選擇 JSON 預覽。還原只合併新增資料，保留既有內容；預覽後有新異動時需重新預覽。</p>
      <button class="btn btn-edit" onclick="exportAccountData()">下載完整備份 JSON</button>
      <div class="form-group"><label for="restore-file">選擇備份 JSON（最多 20 MB）</label><input id="restore-file" type="file" accept=".json,application/json" onchange="previewAccountRestore()"></div>
      <p id="restore-preview" role="status" aria-live="polite"></p>
      <button class="btn btn-edit" onclick="previewAccountRestore()">重新預覽</button>
      <button id="restore-apply" class="btn btn-primary" disabled onclick="applyAccountRestore()">確認合併還原</button>
    </section>
    <section aria-labelledby="history-title"><h3 id="history-title">異動歷史與誤刪復原</h3>
      <button class="btn btn-edit" onclick="loadWorkspaceHistory()">重新整理歷史</button>
      <div id="workspace-history"></div><button id="history-more" class="btn btn-edit" hidden onclick="loadWorkspaceHistory(true)">更多異動</button>
    </section>
    <div class="modal-actions">
      <div class="modal-actions-secondary"><button class="btn btn-delete" onclick="clearLocalWorkspace()">清除此帳號的本機資料</button></div>
      <div class="modal-actions-primary"><button class="btn btn-cancel" onclick="closeWorkspaceModal()">關閉</button></div>
    </div>
  </div>
</div>
