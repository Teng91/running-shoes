<!-- Run Edit Modal -->
<div class="modal-overlay" id="run-modal">
  <form class="modal" style="width: 520px;" data-submit="save-run">
    <h2>編輯跑步紀錄</h2>
    <div class="form-row">
      <div class="form-group"><label for="edit-run-date">日期</label><input id="edit-run-date" type="date" required data-change="run-date-warning" data-form="edit-run"></div>
      <div class="form-group"><label for="edit-run-km">距離 (km)</label><input id="edit-run-km" type="number" min="0.01" max="1000" step="0.01" required></div>
    </div>
    <div class="form-group"><label for="edit-run-shoe">穿哪雙鞋</label><select id="edit-run-shoe" required data-change="run-date-warning" data-form="edit-run"></select></div>
    <p class="run-date-warning" id="edit-run-date-warning" role="status" hidden></p>
    <div class="auth-error" id="edit-run-error"></div>
    <div class="modal-actions">
      <div class="modal-actions-secondary"><button type="button" class="btn btn-delete" data-click="delete-editing-run">刪除</button></div>
      <div class="modal-actions-primary">
        <button type="button" class="btn btn-cancel" data-click="close-run-modal">取消</button>
        <button type="submit" class="btn btn-primary">儲存</button>
      </div>
    </div>
  </form>
</div>
