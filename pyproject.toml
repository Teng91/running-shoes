[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "BLE", "C901", "DTZ", "E4", "E7", "E9", "F", "I", "LOG", "PIE", "PYI", "RUF", "UP"]
# FastAPI resolves dependencies from calls in parameter defaults by design.
ignore = [
    "B008",
    # Full-width punctuation is intentional in Traditional Chinese text.
    "RUF001",
    "RUF002",
    "RUF003",
]

# SPEC-100/110: every function in backend/, scripts/ and unit_tests/ stays below complexity 10;
# a new one above it fails the lint (no `# noqa: C901` remains anywhere).
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["unit_tests"]
