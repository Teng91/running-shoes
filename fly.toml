app = "running-shoes"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  DB_DIR = "/data"
  ENVIRONMENT = "production"

[mount]
  source = "shoes_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # SPEC-073: one 256 MB machine. Past the hard limit Fly's proxy queues or turns
  # requests away instead of letting a flood exhaust the machine's memory.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health/ready"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
